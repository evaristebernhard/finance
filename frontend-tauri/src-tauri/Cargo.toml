[package]
name = "quant-replay-studio-tauri"
version = "0.1.0"
description = "Quant Replay Studio desktop shell"
authors = ["Quant Replay Studio"]
edition = "2021"

[lib]
name = "quant_replay_studio_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]

[workspace]
